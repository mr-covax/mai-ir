db:
  uri: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
  name: crawler

logic:
  request_delay_seconds: 2
  timeout_seconds: 30
  revisit_after_seconds: 86400

sources:
  - name: linux-kernel
    request_delay_seconds: 3
    seeds:
      - https://docs.kernel.org/process/index.html
    include_paths:
      - /process/
    exclude_paths:
      - /process/index.html

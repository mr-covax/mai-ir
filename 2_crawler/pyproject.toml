[project]
name = "crawler"
version = "0.1.0"
description = "Crawler for a low-level programming documentation corpus"
requires-python = ">=3.12"
dependencies = [
    "pymongo>=4.13",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
crawler = "crawler.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

name: crawler

services:
  mongodb:
    image: mongo:8.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval '
          try { if (rs.status().myState === 1) quit(0); }
          catch (e) { if (e.code === 94) rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}); }
          quit(1);'
      interval: 2s
      timeout: 5s
      retries: 60
volumes:
  mongodb-data:
